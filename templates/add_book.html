
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Book | My Library</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header>
    <h1>📚 My Library</h1>
    <nav>
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('add_book') }}">Add Book</a>
        <a href="{{ url_for('add_author') }}">Add Author</a>
    </nav>
</header>

<main class="form-card">
    <h2>Add a New Book</h2>
    <p class="form-description">Enter the book information below.</p>

    {% for message in get_flashed_messages() %}
        <p class="form-message">{{ message }}</p>
    {% endfor %}

    {% if success %}
        <p class="success-message">Book added successfully!</p>
    {% endif %}

    <form action="{{ url_for('add_book') }}" method="POST">

        <label for="title">Book Title</label>
        <input type="text" id="title" name="title" required>

        <label for="publication_year">Publication Year</label>
        <input type="number" id="publication_year"
               name="publication_year" min="1000" max="2026" required>

        <label for="isbn">ISBN</label>
        <input type="text" id="isbn" name="isbn" required>

        <label for="author_id">Author</label>
        <select id="author_id" name="author_id" required>
            {% for author in authors %}
                <option value="{{ author.id }}">{{ author.name }}</option>
            {% endfor %}
        </select>

        <button type="submit">Add Book</button>
    </form>

    <a class="back-link" href="{{ url_for('home') }}">
        ← Back to Library
    </a>
</main>

</body>
</html>

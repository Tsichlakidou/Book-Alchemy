<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Library</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
  <body>
<header>
    <h1>📚 My Library</h1>

    <nav>
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('add_book') }}">Add Book</a>
        <a href="{{ url_for('add_author') }}">Add Author</a>
    </nav>
</header>

<div class="container">


  {% for message in get_flashed_messages() %}
    <p>{{ message }}</p>
{% endfor %}
  <form method="GET">

    <select name="sort_by" required>
    <option value = "title">Title</option>
    <option value = "publication_year">Publicaiton year</option>
    <option value = "author">Author</option>
    </select>
    <button type="submit">Sort</button>
</form>
<form method="GET">
    <input type="text" name="search">
    <button type="submit">Search</button>
</form>
<div class="book-grid">
    {% for book in books %}
        <div class="book-card">

            <img src="https://covers.openlibrary.org/b/isbn/{{ book.isbn }}-M.jpg">

            <h3>
                <a href="{{ url_for('details', book_id=book.id) }}">
                    {{ book.title }}
                </a>
            </h3>

            <p>
                by
                <a href="{{ url_for('author_details', author_id=book.author_id) }}">
                    {{ book.author.name }}
                </a>
            </p>

            <p>{{ book.publication_year }}</p>

            <form action="{{ url_for('delete_book', book_id=book.id) }}" method="POST">
                <button class="delete-button" type="submit">
                    Delete Book
                </button>
            </form>

        </div>
    {% endfor %}
</div>
</div>
  </body>
</html>
